name: Hexo Blog Deploy

on:
  push:
    branches:
      - main  # 监听 main 分支的变动

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予写权限

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true # 以后你用了复杂主题，这行能救命

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Build
      run: npx hexo generate  # 生成网页

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.HEXO_DEPLOY_KEY }}  # 读取你刚才存的 Token
        publish_dir: ./public
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'